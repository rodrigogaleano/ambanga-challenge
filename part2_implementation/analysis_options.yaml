include: package:very_good_analysis/analysis_options.yaml

analyzer:
  exclude:
    # Generated build output.
    - build/**
    # Provided by the assessment and marked "do not modify".
    - notifications/notification.dart
    - notifications/notifications_api.dart
    - rate_limit/interceptor_contract.dart

linter:
  rules:
    # These suggest new Dart 3.13 syntax (`new()` constructors and `;` class
    # bodies). I keep the classic syntax because every Flutter developer knows it.
    empty_container_bodies: false
    unnecessary_type_name_in_constructor: false
